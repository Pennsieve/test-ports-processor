# yaml-language-server: $schema=https://schemas.pennsieve.io/app-manifest/v1.json
schemaVersion: "1.0"
application:
  name: Test Ports Processor
  description: >-
    A test app with two inputs and two outputs, for trying workflows that link
    a step's outputs to another step's inputs. It reports where each input's
    files arrived and copies them on.
  type: processor
  tags:
    - testing
runtime:
  cpu: 256
  memory: 512
  # standard (ECS) by default; a workflow can run a step as a Lambda
  # function instead (the image serves both, see processor/entry.py).
  computeTypes:
    - standard
    - lambda
parameters:
  - name: FAIL_IF_MISSING
    type: boolean
    description: >-
      Fail the run when an input has no files, instead of reporting it as
      missing.
    defaultValue: false
# Each input in its own folder: INPUT_DIR/signals/ and INPUT_DIR/events/
# (placement: subfolder), so a workflow can feed each from a different step.
# The app also finds an input's files at the root of INPUT_DIR, by extension,
# when run without links (or on an older compute node).
inputs:
  - name: signals
    description: Signal tables, as CSV files.
    mediaTypes:
      - text/csv
    placement: subfolder
    required: true
  - name: events
    description: Event lists, as JSON files.
    mediaTypes:
      - application/json
    placement: subfolder
    required: true
# Two outputs: each is written to its own folder, OUTPUT_DIR/<name>/.
outputs:
  - name: summary
    description: report.json, saying which files each input received and where they were found.
    mediaTypes:
      - application/json
  - name: copies
    description: >-
      Each input's files, copied to copies/<input>/, so a following step can
      take them as its own input.
    mediaTypes:
      - text/csv
      - application/json
